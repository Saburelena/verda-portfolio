<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="src/styles/main.scss" />
		<title>Verda</title>
	</head>
	<body>
		<div id="app" class="app">
            <header class="header">
				<div class="header__inner container">
					<!-- Бургер (только мобилка, слева) -->
					<button class="header__burger visible-mobile" 
                           aria-label="Open menu" 
                           aria-expanded="false"
                           data-menu-toggle>
                       <svg class="burger-icon"
					 viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none">
	<rect id="ham" width="24" height="24" x="0" y="0" />
	<path id="Union" d="M2 8C2 7.44772 2.44772 7 3 7L21 7C21.5523 7 22 7.44772 22 8L22 8.5C22 9.05228 21.5523 9.5 21 9.5L3 9.5C2.44772 9.5 2 9.05228 2 8.5L2 8ZM2 15.5C2 14.9477 2.44772 14.5 3 14.5L21 14.5C21.5523 14.5 22 14.9477 22 15.5L22 16C22 16.5523 21.5523 17 21 17L3 17C2.44772 17 2 16.5523 2 16L2 15.5Z" fill="rgb(41,43,50)" fill-rule="evenodd" />
					   </svg>
                    </button>
					<!-- Логотип (всегда) -->
					<a class="header__logo logo" href="/">
						<img
						 src="./src/styles/assets/images/logo.svg"
						 alt="Verda" width="73" height="22" loading="lazy"
						 class="logo__image">
					</a>
					<!-- Навигация (только десктоп) -->
					<nav class="header__menu hidden-mobile" aria-label="Main navigation">
						<ul class="header__menu-list">
							<li class="header__menu-item">
								<a href="/" class="header__menu-link">Catalog</a>
							</li>
							<li class="header__menu-item">
								<a href="/" class="header__menu-link">About</a>
							</li>
							<li class="header__menu-item">
								<a href="/" class="header__menu-link">Delivery</a>
							</li>
						</ul>
					</nav>
					<!-- Actions (справа) -->
					<div class="header__actions">
						 <!-- Sign In (только десктоп) -->
						<button class="header__button header__button--signin-transparent hidden-mobile" aria-label="Sign In">
						  <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none">
	                      <rect id="user 2" width="16" height="16" x="0" y="0" fill="rgb(255,255,255)" fill-opacity="0" />
	                      <path id="Vector" d="M13.3332 14L13.3332 12.6667C13.3332 11.9594 13.0522 11.2811 12.5521 10.781C12.052 10.281 11.3737 10 10.6665 10L5.33317 10C4.62593 10 3.94765 10.281 3.44755 10.781C2.94746 11.2811 2.6665 11.9594 2.6665 12.6667L2.6665 14" fill-rule="nonzero" stroke="rgb(41,43,50)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" />

                          </svg>
                          <span class="button-text">Sign in</span>
					    </button>
						<!-- Cart (всегда) -->
					    <button class="header__button header__button--cart" aria-label="Cart">
					  <svg class="cart-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none">
	                      <rect id="Cart" width="18" height="18" x="0" y="0" />

55,255)" fill-rule="nonzero" />
                          </svg>
						  <span class="cart-text">Cart</span>
                          <span class="cart-count" aria-hidden="true">3</span>
					    </button>	
					</div>
				</div>
				<!-- Мобильное меню -->
					<div class="mobile-menu" data-mobile-menu hidden>
						<nav class="mobile-menu__nav">
							<ul class="mobile-menu__list">
								<li class="mobile-menu__item">
								<a href="/" class="mobile-menu__link">Catalog</a>
							</li>
							<li class="mobile-menu__item">
								<a href="/" class="mobile-menu__link">About</a>
							</li>
							<li class="mobile-menu__item">
								<a href="/" class="mobile-menu__link">Delivery</a>
							</li>
							<li class="mobile-menu__divider" role="separator" aria-hidden="true"></li>
							<li>
								<button class="mobile-menu__button mobile-menu__button--signin"
                            aria-label="Sign In">
                       <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none">
	                      <rect id="user 2" width="16" height="16" x="0" y="0" fill="rgb(255,255,255)" fill-opacity="0" />
	                      <path id="Vector" d="M13.3332 14L13.3332 12.6667C13.3332 11.9594 13.0522 11.2811 12.5521 10.781C12.052 10.281 11.3737 10 10.6665 10L5.33317 10C4.62593 10 3.94765 10.281 3.44755 10.781C2.94746 11.2811 2.6665 11.9594 2.6665 12.6667L2.6665 14" fill-rule="nonzero" stroke="rgb(41,43,50)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" />
	                      <path id="Vector" d="M8.00016 7.33333C6.5274 7.33333 5.3335 6.13943 5.3335 4.66667C5.3335 3.19391 6.5274 2 8.00016 2C9.47292 2 10.6668 3.19391 10.6668 4.66667C10.6668 6.13943 9.47292 7.33333 8.00016 7.33333Z" stroke="rgb(41,43,50)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" />
                          </svg>
                          Sign in
					    </button>
							</li>
							</ul>
						</nav>
					</div>
			</header>
			<main class="main main-layout">
				<div class="main__container container">
					<div class="main__inner">
						<h1 class="main__title">Verda!</h1>
					</div>
				</div>
			</main>
		</div>
	</body>
</html>
